paths:
  /api/wishlist:
    get:
      summary: Get user wishlist
      operationId: getUserWishlist
      tags:
        - Wishlist
      responses:
        '200':
          description: A list of wishlist items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WishlistDTO'
        '500':
          $ref: './common.yaml#/components/responses/InternalServerError'

components:
  schemas:
    WishlistDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        userId:
          type: integer
          format: int64
        collegeId:
          type: integer
          format: int64