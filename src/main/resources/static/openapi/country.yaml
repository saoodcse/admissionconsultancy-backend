paths:
  # PUBLIC ENDPOINTS

  /api/countries:
    get:
      summary: Get all active countries
      operationId: getActiveCountries
      tags:
        - Country Management
      responses:
        '200':
          description: Successfully fetched active countries (AppCode 2000)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CountryListResponse'
        '500':
          $ref: './common.yaml#/components/responses/InternalServerError'

  /api/countries/{slug}:
    get:
      summary: Get country by slug
      operationId: getCountryBySlug
      tags:
        - Country Management
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successfully fetched the country details (AppCode 2000)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CountryResponse'
        '404':
          $ref: './common.yaml#/components/responses/NotFound'
        '500':
          $ref: './common.yaml#/components/responses/InternalServerError'

  # ==========================================
  # PROTECTED ADMIN ENDPOINTS
  # ==========================================
  /api/admin/countries/all:
    get:
      summary: Get all countries (Admin)
      operationId: getAllCountriesAdmin
      tags:
        - Country Management (Admin)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Successfully fetched all countries (AppCode 2000)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CountryListResponse'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '500':
          $ref: './common.yaml#/components/responses/InternalServerError'

  /api/admin/countries:
    post:
      summary: Create a new country
      operationId: createCountry
      tags:
        - Country Management (Admin)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CountryDTO'
      responses:
        '201':
          description: Successfully created the country (AppCode 2001)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CountryResponse'
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '409':
          $ref: './common.yaml#/components/responses/Conflict'
        '500':
          $ref: './common.yaml#/components/responses/InternalServerError'

  /api/admin/countries/{slug}:
    put:
      summary: Update an existing country
      operationId: updateCountry
      tags:
        - Country Management (Admin)
      security:
        - bearerAuth: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CountryDTO'
      responses:
        '200':
          description: Successfully updated the country (AppCode 2002)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CountryResponse'
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '404':
          $ref: './common.yaml#/components/responses/NotFound'
        '409':
          $ref: './common.yaml#/components/responses/Conflict'
        '500':
          $ref: './common.yaml#/components/responses/InternalServerError'

    delete:
      summary: Soft-delete a country
      operationId: deleteCountry
      tags:
        - Country Management (Admin)
      security:
        - bearerAuth: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successfully deleted the country (AppCode 2003)
          content:
            application/json:
              example:
                success: true
                statuscode: 2003
                message: "Resource deleted successfully"
                data: null
                timestamp: "2026-08-09T12:20:00.0000000"
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '404':
          $ref: './common.yaml#/components/responses/NotFound'
        '500':
          $ref: './common.yaml#/components/responses/InternalServerError'

components:
  schemas:
    # ==========================================
    # NESTED & ROW DTO SCHEMAS
    # ==========================================
    UniversitySummaryDTO:
      type: object
      properties:
        name: { type: string }
        slug: { type: string }
        logo: { type: string }
        countryName: { type: string }

    CountryHighlightDTO:
      type: object
      properties:
        feature: { type: string }
        detail: { type: string }

    CountryWhyStudyPointDTO:
      type: object
      properties:
        title: { type: string }
        content: { type: string }

    CountryEligibilityDTO:
      type: object
      properties:
        detail: { type: string }
        requirement: { type: string }

    CountryAdmissionStepDTO:
      type: object
      properties:
        stepOrder: { type: integer, format: int32 }
        title: { type: string }
        content: { type: string }

    CountrySemesterDTO:
      type: object
      properties:
        semester: { type: string }
        subjects:
          type: array
          items: { type: string }

    CountryFmgePassRateDTO:
      type: object
      properties:
        university: { type: string }
        passRate: { type: string }

    CountryFeeStructureDTO:
      type: object
      properties:
        universityName: { type: string }
        tuitionFeeNative: { type: string, example: "400,000 RUB" }
        hostelFeeNative: { type: string, example: "50,000 RUB" }
        nativeCurrencyCode: { type: string, example: "RUB" }
        annualTuitionUsd: { type: number, format: double, example: 5000.0 }
        annualHostelUsd: { type: number, format: double, example: 800.0 }

    CountryLivingCostDTO:
      type: object
      properties:
        expenseCategory: { type: string }
        monthlyCost: { type: string }

    CountryScholarshipDTO:
      type: object
      properties:
        name: { type: string }
        description: { type: string }

    CountryHostelFacilityDTO:
      type: object
      properties:
        criteria: { type: string }
        information: { type: string }

    CountryAboutAttributeDTO:
      type: object
      properties:
        attribute: { type: string }
        detail: { type: string }

    CountryDestinationDTO:
      type: object
      properties:
        name: { type: string }
        slug: { type: string }
        flag: { type: string }

    CountryFaqDTO:
      type: object
      properties:
        question: { type: string }
        answer: { type: string }

    # ==========================================
    # MASTER COUNTRY DTO
    # ==========================================
    CountryDTO:
      type: object
      description: The global master DTO for Country, supporting SEO tags, legal/visa metadata, and multi-currency metrics.
      required:
        - name
        - slug
      properties:
        name: { type: string }
        slug: { type: string }
        flag: { type: string }
        banner: { type: string }
        heroTitle: { type: string }
        heroSubtitle: { type: string }

        # SEO & OpenGraph Meta Tags
        metaTitle: { type: string }
        metaDescription: { type: string }
        keywords: { type: string }
        ogTitle: { type: string }
        ogDescription: { type: string }
        ogImage: { type: string }
        canonicalUrl: { type: string }

        overview: { type: string }

        # Section Titles and Intros
        whyStudyTitle: { type: string }
        whyStudyIntro: { type: string }
        eligibilityTitle: { type: string }
        eligibilityIntro: { type: string }
        thingsToConsiderTitle: { type: string }
        thingsToConsiderIntro: { type: string }
        admissionProcessTitle: { type: string }
        admissionProcessIntro: { type: string }
        documentsTitle: { type: string }
        syllabusTitle: { type: string }
        syllabusIntro: { type: string }
        fmgeTitle: { type: string }
        fmgeIntro: { type: string }
        fmgeNote: { type: string }
        feeStructureTitle: { type: string }
        feeStructureIntro: { type: string }
        livingCostTitle: { type: string }
        livingCostIntro: { type: string }
        scholarshipTitle: { type: string }
        scholarshipIntro: { type: string }
        hostelTitle: { type: string }
        hostelIntro: { type: string }
        topUniversitiesTitle: { type: string }
        topUniversitiesIntro: { type: string }
        benefitsTitle: { type: string }
        nmcApprovedTitle: { type: string }
        aboutCountryTitle: { type: string }
        aboutCountryContent: { type: string }
        popularDestinationsTitle: { type: string }
        faqTitle: { type: string }

        # Global Admissions, Legal & Currency Filtering Metadata
        postStudyWorkRights: { type: string, example: "1-3 Years Work Visa" }
        licensingExamNote: { type: string, example: "Recognized for FMGE, USMLE, PLAB" }
        isPrPathAvailable: { type: boolean, example: true }
        minAnnualTuitionUsd: { type: number, format: double, example: 3500.0 }
        maxAnnualTuitionUsd: { type: number, format: double, example: 8000.0 }
        avgMonthlyLivingUsd: { type: number, format: double, example: 250.0 }
        availableIntakes:
          type: array
          items: { type: string }
          example: ["September Intake", "January Intake"]
        applicationDeadlineNote: { type: string, example: "Applications close 30 days prior" }

        # Global Compliance, Language & Student Life
        acceptedLanguageTests:
          type: array
          items: { type: string }
          example: ["IELTS", "TOEFL", "PTE"]
        minimumLanguageScoreNote: { type: string, example: "Overall 6.0 bands" }
        visaSuccessRate: { type: string, example: "High (~90-95%)" }
        requiresBlockedAccount: { type: boolean, example: false }
        partTimeWorkAllowedHours: { type: string, example: "20 hours per week" }
        healthInsuranceRequirement: { type: string, example: "Mandatory (~$200/year)" }
        climateOverview: { type: string, example: "Moderate summers, cold winters" }
        totalInternationalStudents: { type: string, example: "20,000+ Global Students" }
        safetyIndexRating: { type: string, example: "Very Safe" }

        showGetFreeConsultation: { type: boolean }
        showConnectWithCounselor: { type: boolean }
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

        # Lists & Collections
        universities:
          type: array
          items: { $ref: '#/components/schemas/UniversitySummaryDTO' }
        highlights:
          type: array
          items: { $ref: '#/components/schemas/CountryHighlightDTO' }
        whyStudyPoints:
          type: array
          items: { $ref: '#/components/schemas/CountryWhyStudyPointDTO' }
        eligibilityTable:
          type: array
          items: { $ref: '#/components/schemas/CountryEligibilityDTO' }
        thingsToConsiderPoints:
          type: array
          items: { type: string }
        admissionProcessSteps:
          type: array
          items: { $ref: '#/components/schemas/CountryAdmissionStepDTO' }
        documentsList:
          type: array
          items: { type: string }
        syllabusSemesters:
          type: array
          items: { $ref: '#/components/schemas/CountrySemesterDTO' }
        fmgePassRates:
          type: array
          items: { $ref: '#/components/schemas/CountryFmgePassRateDTO' }
        feeStructureRows:
          type: array
          items: { $ref: '#/components/schemas/CountryFeeStructureDTO' }
        livingCostRows:
          type: array
          items: { $ref: '#/components/schemas/CountryLivingCostDTO' }
        scholarshipTypes:
          type: array
          items: { $ref: '#/components/schemas/CountryScholarshipDTO' }
        hostelFacilities:
          type: array
          items: { $ref: '#/components/schemas/CountryHostelFacilityDTO' }
        benefitsList:
          type: array
          items: { type: string }
        aboutCountryTable:
          type: array
          items: { $ref: '#/components/schemas/CountryAboutAttributeDTO' }
        popularDestinations:
          type: array
          items: { $ref: '#/components/schemas/CountryDestinationDTO' }
        faqs:
          type: array
          items: { $ref: '#/components/schemas/CountryFaqDTO' }
        galleryImages:
          type: array
          items: { type: string }

    # ==========================================
    # API RESPONSE WRAPPERS
    # ==========================================
    CountryResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        statuscode: { type: integer, example: 2000 }
        message: { type: string, example: "Operation successful" }
        data: { $ref: '#/components/schemas/CountryDTO' }
        timestamp: { type: string, format: date-time }

    CountryListResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        statuscode: { type: integer, example: 2000 }
        message: { type: string, example: "Operation successful" }
        data:
          type: array
          items: { $ref: '#/components/schemas/CountryDTO' }
        timestamp: { type: string, format: date-time }